name: Bug Report
description: Create a report to help us improve GazaOS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: device
    attributes:
      label: Device & Codename
      description: e.g. Xiaomi Redmi Note 12 5G (stone)
      placeholder: stone
    validations:
      required: true
  - type: input
    id: build_version
    attributes:
      label: GazaOS Build Version
      description: e.g. GazaOSAndroid-16.2-20261124-stone-v16.2
      placeholder: 16.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: logcat
    attributes:
      label: Logcat / Error Logs
      description: Attach relevant logcat or dmesg snippet.
      render: shell
